<style>
/* ================== Polaris · AstroNexus 2026 wayfinder · all styles scoped under .anx ================== */
.anx {
  /* AstroNexus palette */
  /* AstroNexus palette, verbatim from the landing page. Legacy names kept so
     every downstream rule picks the new values up untouched. */
  --teal: #549ca8; --steel: #1a140d; --navy: #14100b; --deep: #0a0806; --ink: #0a0806;
  --indigo: #14100b; --royal: #1a140d; --lav: #549ca8;
  --gold: #e4b46c; --gold2: #d9a658; --sand: #f0e4a8; --text: #f4ede0; --muted: #9a8f7a;
  --line: #ffffff1f; --glass: rgba(10,8,6,.82);
  position: relative; max-width: 1280px; margin: 0 auto; height: clamp(640px, 88vh, 880px);
  border-radius: 22px; overflow: hidden; color: var(--text); background: var(--ink);
  font-family: 'Manrope', 'Segoe UI', sans-serif; border: 1px solid var(--line);
  box-shadow: 0 40px 100px rgba(0,0,0,.55), inset 0 0 0 1px rgba(255,255,255,.02);
}
.anx *, .anx *::before, .anx *::after { box-sizing: border-box; }
:where(.anx) button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; }
.anx .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; letter-spacing: .14em; text-transform: uppercase; }
.anx-screen { position: absolute; inset: 0; transition: opacity .6s ease, transform .6s ease; }
.anx-screen[hidden] { display: block; opacity: 0; pointer-events: none; transform: scale(1.02); }

/* ---------- WELCOME ---------- */
.anx-welcome { display: grid; grid-template-rows: auto 1fr auto; padding: 22px clamp(18px, 4vw, 44px); overflow-x: hidden; overflow-y: auto; scrollbar-width: thin;
  background: radial-gradient(55% 45% at 62% 42%, rgba(216,157,69,.16), transparent 62%), radial-gradient(40% 40% at 90% 100%, rgba(220,154,55,.22), transparent 65%), #030201; }
.anx-welcome > *:not(.anx-stars):not(.anx-rocket):not(.anx-frame) { z-index: 2; }
.anx-rocket { position: absolute; right: clamp(-40px, 2vw, 40px); bottom: -6%; width: clamp(210px, 30vw, 380px); z-index: 1; pointer-events: none;
  animation: anxLaunchIn 2.6s cubic-bezier(.16,.8,.3,1) both, anxRumble .14s 2.6s linear infinite; }
.anx-rocket img { width: 100%; display: block; filter: drop-shadow(0 0 30px rgba(221,158,64,.35)); }
.anx-rocket canvas { position: absolute; left: -30%; top: 55%; width: 160%; height: 80%; }
.anx-rocket.blast { animation: anxBlast 1.1s cubic-bezier(.55,0,.9,.4) forwards; }
.anx-rocket::after { content: ""; position: absolute; left: 10%; right: 0; bottom: -4%; height: 34%; background: radial-gradient(50% 50% at 50% 60%, rgba(226,171,89,.55), transparent 70%);
  filter: blur(8px); animation: anxFlick .09s linear infinite alternate; }
@keyframes anxLaunchIn { from { transform: translateY(70%) scale(.92); opacity: 0; } 30% { opacity: 1; } to { transform: none; } }
@keyframes anxRumble { 0% { transform: translate(0, 0); } 25% { transform: translate(.6px, -.5px); } 50% { transform: translate(-.5px, .4px); } 75% { transform: translate(.4px, .6px); } 100% { transform: translate(0, 0); } }
@keyframes anxBlast { from { transform: none; } to { transform: translateY(-160%) scale(.8); opacity: .2; } }
@keyframes anxFlick { from { opacity: .65; } to { opacity: 1; } }
@media (max-width: 760px) { .anx-rocket { width: 150px; right: -18px; top: 60px; bottom: auto; opacity: .55; } }
.anx-stars { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.anx-frame { position: absolute; inset: 14px; border: 1px solid var(--line); border-radius: 14px; pointer-events: none; }
.anx-frame::before, .anx-frame::after { content: ""; position: absolute; width: 26px; height: 26px; border: 2px solid var(--gold); }
.anx-frame::before { left: -1px; top: -1px; border-right: 0; border-bottom: 0; border-radius: 14px 0 0 0; }
.anx-frame::after { right: -1px; bottom: -1px; border-left: 0; border-top: 0; border-radius: 0 0 14px 0; }
.anx-top { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.anx-top img.astro { height: clamp(46px, 7vw, 74px); filter: drop-shadow(0 0 18px rgba(220,168,91,.35)); }
.anx-gems { background: #fff; border-radius: 12px; padding: 6px 10px; display: flex; }
.anx-gems img { height: clamp(26px, 3.6vw, 38px); display: block; }
.anx-hero { position: relative; align-self: center; max-width: 760px; }
.anx-kicker { font-size: clamp(11px, 1.3vw, 13px); color: var(--sand); margin: 0 0 14px; display: flex; align-items: center; gap: 10px; }
.anx-kicker::before { content: ""; width: 34px; height: 1px; background: var(--gold); }
.anx-h1 { font-family: 'Fraunces', Georgia, serif; font-weight: 400; margin: 0; line-height: 1.02;
  font-size: clamp(44px, 7.4vw, 96px); letter-spacing: -.015em; color: var(--text); }
.anx-h1 small { display: block; font-size: .42em; letter-spacing: .06em; color: var(--text); -webkit-text-fill-color: var(--text); filter: none; margin-top: 10px; }
.anx-lede { margin: 18px 0 0; font-size: clamp(11px, 1.2vw, 13px); color: var(--muted); line-height: 1.9; border-left: 2px solid var(--gold); padding-left: 14px; }
.anx-tiles { position: relative; display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.anx-tile { text-align: left; padding: 14px 14px 12px; border-radius: 14px; background: var(--glass); border: 1px solid rgba(217,164,84,.22);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); transition: .25s; position: relative; overflow: hidden; }
.anx-tile::after { content: "→"; position: absolute; right: 12px; top: 12px; color: var(--gold); opacity: .0; transition: .25s; }
.anx-tile:hover { border-color: var(--gold); transform: translateY(-2px); box-shadow: 0 10px 30px rgba(220,168,91,.12); }
.anx-tile:hover::after { opacity: 1; right: 10px; }
.anx-tile b { display: block; font-size: 15px; }
.anx-tile span { display: block; margin-top: 4px; font-size: 10.5px; color: var(--muted); }
.anx-tile i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
.anx-tile .live { color: #a6ced5; }
.anx-ctaRow { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 12px; flex-wrap: wrap; }
.anx-cta { display: inline-flex; align-items: center; gap: 10px; padding: 12px 20px; border-radius: 999px; font-weight: 700;
  background: linear-gradient(90deg, var(--gold), var(--sand)); color: #120e0a; box-shadow: 0 0 30px rgba(220,168,91,.35); }
.anx-count { font-size: 11px; color: var(--sand); }
.anx-tlh { position: relative; margin: 0 0 8px; font-size: 10.5px; color: var(--muted); }
.anx-welcome .anx-tiles { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.anx-welcome .anx-tile { padding: 10px 12px; }
.anx-welcome .anx-tile b { font-size: 14px; margin: 2px 0; }
.anx-welcome .anx-tile span { margin-top: 2px; font-size: 9.5px; }
.anx-h1 small { font-size: .3em !important; }
.anx-welcome .anx-hero { max-width: 640px; }
.anx-welcome .anx-lede { margin-top: 12px; line-height: 1.75; }
.anx-tile em { font-style: normal; color: var(--sand); }

/* ---------- NAVIGATOR ---------- */
.anx-nav { background: var(--deep); }
.anx-bar { position: absolute; z-index: 5; left: 14px; right: 14px; top: 14px; display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center;
  padding: 10px; border-radius: 16px; background: var(--glass); border: 1px solid var(--line); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); max-width: 640px; }
.anx-back { width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,.06); display: grid; place-items: center; font-size: 18px; }
.anx-back:hover { background: rgba(220,168,91,.18); }
.anx-fields { display: grid; gap: 6px; }
.anx-field { display: grid; grid-template-columns: 18px 1fr auto; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 9px 12px; border-radius: 11px;
  background: rgba(4,3,2,.55); border: 1px solid rgba(255,255,255,.07); font-size: 14px; font-weight: 500; }
.anx-field:hover { border-color: var(--gold); }
.anx-field .ic { width: 12px; height: 12px; border-radius: 50%; border: 2.5px solid var(--lav); justify-self: center; }
.anx-field .ic.to { border: 0; width: 14px; height: 18px; background: none; }
.anx-field .fl { font: 700 10.5px 'IBM Plex Mono', monospace; color: var(--sand); padding: 3px 7px; border-radius: 6px; background: rgba(220,168,91,.12); }
.anx-swap { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-size: 18px; background: rgba(255,255,255,.06); }
.anx-swap:hover { background: rgba(220,168,91,.18); }

.anx-map { position: absolute; inset: 0; touch-action: none; }
.anx-map svg { width: 100%; height: 100%; display: block; cursor: grab; user-select: none; }
.anx-map svg.drag { cursor: grabbing; }
.anx-ctrl { position: absolute; z-index: 4; right: 14px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 6px; }
.anx-ctrl button { width: 42px; height: 42px; border-radius: 12px; background: var(--glass); border: 1px solid var(--line); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); font-size: 17px; font-weight: 700; display: grid; place-items: center; }
.anx-ctrl button:hover, .anx-ctrl button[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
.anx-ctrl .sm { font: 700 9.5px 'IBM Plex Mono', monospace; letter-spacing: .05em; }
.anx-hud { position: absolute; z-index: 4; right: 14px; top: 14px; text-align: right; font-size: 10.5px; color: var(--muted); line-height: 1.7; pointer-events: none; }
.anx-hud b { color: var(--sand); font-weight: 700; }

/* step card */
.anx-card { position: absolute; z-index: 5; left: 14px; bottom: 14px; width: min(420px, calc(100% - 28px)); border-radius: 18px; background: var(--glass);
  border: 1px solid var(--line); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,.4); }
.anx-cardHead { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,.06); }
.anx-cardHead .t { font-size: 10.5px; color: var(--sand); }
.anx-cardHead .m { font-size: 12.5px; color: var(--muted); }
.anx-cardHead .m b { color: var(--text); }
.anx-now { display: grid; grid-template-columns: 58px 1fr; gap: 14px; align-items: center; padding: 16px; }
.anx-arrow { width: 58px; height: 58px; border-radius: 16px; display: grid; place-items: center;
  background: radial-gradient(circle at 30% 25%, rgba(237,224,156,.35), rgba(220,168,91,.08)); border: 1px solid rgba(220,168,91,.45); }
.anx-arrow svg { width: 34px; height: 34px; }
.anx-instr { font-size: 17px; font-weight: 700; line-height: 1.3; }
.anx-instr small { display: block; margin-top: 4px; font: 400 11px 'IBM Plex Mono', monospace; letter-spacing: .08em; color: var(--sand); text-transform: uppercase; }
.anx-stepNav { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; padding: 0 16px 14px; align-items: center; }
.anx-dots { display: flex; gap: 5px; flex-wrap: wrap; }
.anx-dots i { width: 18px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.15); }
.anx-dots i.on { background: var(--gold); }
.anx-dots i.done { background: rgba(220,168,91,.45); }
.anx-btn { padding: 9px 14px; border-radius: 10px; background: rgba(255,255,255,.07); font-size: 13px; font-weight: 600; }
.anx-btn.primary { background: linear-gradient(90deg, var(--gold), var(--sand)); color: #120e0a; }
.anx-btn:disabled { opacity: .35; cursor: default; }
.anx-all { border-top: 1px solid rgba(255,255,255,.06); }
.anx-all summary { list-style: none; cursor: pointer; padding: 10px 16px; font-size: 12px; color: var(--muted); }
.anx-all summary::-webkit-details-marker { display: none; }
.anx-all summary::after { content: " ▾"; }
.anx-all[open] summary::after { content: " ▴"; }
.anx-list { list-style: none; margin: 0; padding: 0 12px 12px; max-height: 190px; overflow: auto; }
.anx-list li { display: grid; grid-template-columns: 26px 1fr auto; gap: 10px; align-items: center; padding: 8px; border-radius: 10px; font-size: 13px; cursor: pointer; }
.anx-list li:hover { background: rgba(255,255,255,.05); }
.anx-list li.on { background: rgba(220,168,91,.12); }
.anx-list li svg { width: 20px; height: 20px; }
.anx-list li span { font: 400 10.5px 'IBM Plex Mono', monospace; color: var(--muted); }
.anx-pending { padding: 16px; font-size: 13.5px; line-height: 1.55; color: var(--muted); }
.anx-pending b { color: var(--text); }

/* picker sheet */
.anx-sheet { position: absolute; z-index: 8; inset: 0; background: rgba(4,3,2,.55); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); display: grid; place-items: start center; padding: 80px 14px 14px; }
.anx-sheet[hidden] { display: none; }
.anx-sheetBox { width: min(560px, 100%); max-height: 100%; overflow: auto; border-radius: 18px; background: var(--deep); border: 1px solid var(--line); padding: 14px; }
.anx-sheetBox input { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,.1); background: rgba(0,0,0,.25); color: var(--text); font: 15px 'Manrope', sans-serif; outline: none; }
.anx-sheetBox input:focus { border-color: var(--gold); }
.anx-grp { margin: 14px 4px 6px; font-size: 10.5px; color: var(--sand); }
.anx-opt { display: grid; grid-template-columns: 12px 1fr auto; gap: 12px; align-items: center; width: 100%; text-align: left; padding: 11px 10px; border-radius: 10px; }
.anx-opt:hover { background: rgba(220,168,91,.1); }
.anx-opt i { width: 10px; height: 10px; border-radius: 50%; }
.anx-opt small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
.anx-opt em { font: 700 10px 'IBM Plex Mono', monospace; font-style: normal; color: var(--sand); }

/* map element styles */
.anx-lbl { font: 600 8px 'Manrope', sans-serif; fill: var(--muted); letter-spacing: .02em; pointer-events: none; }
.anx-lbl.big { font: 400 13px 'Fraunces', Georgia, serif; letter-spacing: 0; fill: rgba(237,224,156,.55); }
.anx-lbl.mono { font: 700 6.5px 'IBM Plex Mono', monospace; letter-spacing: .14em; fill: rgba(180,167,147,.55); }
.anx-pin text { font: 700 8.5px 'Manrope', sans-serif; fill: var(--text); pointer-events: none; }
.anx-pin rect.chip { fill: rgba(13,10,7,.9); stroke: rgba(220,168,91,.35); stroke-width: .6; }
.anx-pin { cursor: pointer; transition: opacity .3s; }
.anx-pin.dim { opacity: .55; }
.anx-pulse { transform-box: fill-box; transform-origin: center; animation: anxPulse 2.2s ease-out infinite; }
@keyframes anxPulse { 0% { transform: scale(.5); opacity: .7; } 100% { transform: scale(2.4); opacity: 0; } }
.anx-chev { animation: anxChev 1.6s ease-in-out infinite; }
@keyframes anxChev { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }

@media (max-width: 760px) {
  .anx { height: auto; min-height: 0; }
  .anx-screen:not([hidden]) { position: relative; }
  .anx-welcome { display: flex; flex-direction: column; gap: 26px; padding: 30px 22px 26px; }
  .anx-top { margin-bottom: 4px; }
  .anx-nav:not([hidden]) { height: 88vh; min-height: 600px; }
  .anx-tiles { grid-template-columns: 1fr 1fr; }
  .anx-now { padding: 12px 14px; grid-template-columns: 46px 1fr; }
  .anx-arrow { width: 46px; height: 46px; border-radius: 13px; }
  .anx-arrow svg { width: 26px; height: 26px; }
  .anx-cardHead { padding: 10px 14px; }
  .anx-stepNav { padding: 0 14px 10px; }
  .anx-alsoRow .mono { display: none; }
  .anx-bar { left: 10px; right: 10px; top: 10px; }
  .anx-card { left: 10px; right: 10px; bottom: 10px; width: auto; }
  .anx-ctrl { top: 150px; transform: none; right: 10px; }
  .anx-hud { display: none; }
  .anx-instr { font-size: 15.5px; }
}
@media (prefers-reduced-motion: reduce) { .anx * { animation: none !important; transition: none !important; } }

/* step photo + volunteer */
.anx-photo { display: block; width: calc(100% - 32px); margin: 0 16px 12px; padding: 0; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); position: relative; cursor: zoom-in; }
.anx-photo img { display: block; width: 100%; height: 150px; object-fit: cover; }
.anx-photo span { position: absolute; left: 8px; bottom: 8px; padding: 4px 8px; border-radius: 8px; background: rgba(4,3,2,.8); font: 700 10px 'IBM Plex Mono', monospace; letter-spacing: .1em; color: var(--sand); }
.anx-vol { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; margin: 0 16px 12px; padding: 10px 12px; border-radius: 14px;
  background: rgba(217,164,84,.14); border: 1px solid rgba(217,164,84,.4); color: var(--text); text-decoration: none; }
.anx-vol .av, .anx-vcard .av { width: 44px; height: 44px; border-radius: 50%; overflow: hidden; display: grid; place-items: center; background: linear-gradient(135deg, var(--royal), var(--lav)); font: 700 14px Inter; color: #fff; border: 2px solid var(--lav); }
.anx-vol .av img, .anx-vcard .av img { width: 100%; height: 100%; object-fit: cover; }
.anx-vol b { display: block; font-size: 14px; } .anx-vol small { color: var(--muted); font-size: 12px; }
.anx-call { padding: 8px 12px; border-radius: 10px; background: var(--lav); color: #14100b; font-weight: 700; font-size: 13px; text-decoration: none; white-space: nowrap; }
.anx-call.off { background: rgba(255,255,255,.08); color: var(--muted); }
.anx-vcard { display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center; padding: 10px; border-radius: 12px; }
.anx-vcard .av { width: 56px; height: 56px; }
.anx-vcard:hover { background: rgba(255,255,255,.04); }
.anx-vcard b { display: block; font-size: 15px; } .anx-vcard small { color: var(--muted); font-size: 12.5px; }
.anx-light { position: absolute; inset: 0; z-index: 9; background: rgba(4,3,2,.9); display: grid; place-items: center; padding: 20px; cursor: zoom-out; }
.anx-light img { max-width: 100%; max-height: 82%; border-radius: 14px; border: 1px solid var(--line); }
.anx-light p { margin: 12px 0 0; text-align: center; color: var(--sand); font-size: 15px; }
.anx-helpbtn { position: absolute; z-index: 4; left: 14px; top: 160px; display: inline-flex; gap: 8px; align-items: center; padding: 10px 14px; border-radius: 999px; background: rgba(217,164,84,.22);
  border: 1px solid rgba(217,164,84,.55); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); font-weight: 700; font-size: 13px; }
.anx-helpbtn:hover { background: rgba(217,164,84,.35); }
@media (max-width: 760px) { .anx-helpbtn { top: auto; bottom: auto; left: auto; right: 10px; top: 370px; padding: 9px 11px; } .anx-photo img { height: 110px; } }
/* demo page only */
body { margin: 0; padding: 24px 16px; background: #090705; }
/* ---------- KIOSK MODE (touchscreen at a fixed spot: wayfinder.html?kiosk=exit3) ---------- */
body.anx-kiosk { padding: 0; overflow: hidden; user-select: none; -webkit-user-select: none; }
.anx-kiosk .anx { height: 100vh; max-width: none; border-radius: 0; border: 0; }
.anx-kiosk .anx-tiles { grid-template-columns: repeat(4, 1fr); }
.anx-kiosk .anx-h1 { font-size: clamp(40px, min(6.4vw, 9vh), 92px); }
.anx-kiosk .anx-welcome { padding-top: 18px; padding-bottom: 18px; }
.anx-kiosk .anx-tile { padding: 14px 16px 12px; } .anx-kiosk .anx-tile b { font-size: 19px; } .anx-kiosk .anx-tile span { font-size: 12px; }
.anx-kiosk .anx-cta { padding: 18px 30px; font-size: 19px; animation: kioskPulse 2.4s ease-in-out infinite; }
@keyframes kioskPulse { 50% { box-shadow: 0 0 0 14px rgba(220,168,91,.0), 0 0 50px rgba(220,168,91,.55); } }
.anx-kiosk .anx-instr { font-size: 21px; } .anx-kiosk .anx-btn { padding: 14px 22px; font-size: 16px; }
.anx-kiosk .anx-card { width: min(480px, calc(100% - 28px)); }
.anx-kiosk #anxSwap, .anx-kiosk #anxHome { visibility: hidden; }
.anx-kiosk #anxFrom { cursor: default; border-color: rgba(217,164,84,.5); }
.anx-kiosk .anx-ctrl button { width: 54px; height: 54px; font-size: 22px; }

.anx-here { display: inline-flex; align-items: center; gap: 10px; padding: 8px 14px; border-radius: 999px; background: rgba(217,164,84,.18); border: 1px solid rgba(217,164,84,.5); font: 700 12px 'IBM Plex Mono', monospace; letter-spacing: .14em; text-transform: uppercase; color: #f6efcb; margin-bottom: 14px; }

    return { ...I, W: m.width, H: m.height };
  }
  function fit(pts, pad = 30, minW = 200) {
    const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]), I = insets();
    const aw = Math.max(I.W - I.l - I.r, 120), ah = Math.max(I.H - I.t - I.b, 120), r = aw / ah;
    const x0 = Math.min(...xs) - pad, x1 = Math.max(...xs) + pad, y0 = Math.min(...ys) - pad, y1 = Math.max(...ys) + pad;
    let w = Math.max(x1 - x0, minW), h = Math.max(y1 - y0, minW * .8); if (w / h > r) h = w / r; else w = h * r;
    const s = w / aw, cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
    cam([cx - (I.l + aw / 2) * s, cy - (I.t + ah / 2) * s, I.W * s, I.H * s]);
  }
  const zoom = (f, cx, cy) => { const [x, y, w, h] = vb; cx ??= x + w / 2; cy ??= y + h / 2; const nw = Math.min(Math.max(w * f, 110), 700), nh = nw * h / w; setVB([cx - (cx - x) * nw / w, cy - (cy - y) * nh / h, nw, nh]); };
  $('#anxIn').onclick = () => zoom(.75); $('#anxOut').onclick = () => zoom(1.33);
  $('#anxAll').onclick = () => st.route ? fit(st.route.pts) : fit([[0, 0], [670, 560]], 0);
  $('#anxSatBtn').onclick = e => { const on = e.currentTarget.getAttribute('aria-pressed') !== 'true'; e.currentTarget.setAttribute('aria-pressed', on);
    $('#anxSat').setAttribute('opacity', on ? .9 : 0); $('#anxVector').style.opacity = on ? .25 : 1; };
  const toMap = e => { const r = svg.getBoundingClientRect(), [x, y, w, h] = vb, s = Math.max(w / r.width, h / r.height); return [x + w / 2 + (e.clientX - r.left - r.width / 2) * s, y + h / 2 + (e.clientY - r.top - r.height / 2) * s]; };
  svg.addEventListener('wheel', e => { e.preventDefault(); const p = toMap(e); zoom(e.deltaY > 0 ? 1.12 : .89, p[0], p[1]); }, { passive: false });
  const ptr = new Map(); let last = null, pin = null;
  svg.addEventListener('pointerdown', e => { ptr.set(e.pointerId, e); svg.setPointerCapture(e.pointerId); svg.classList.add('drag'); last = e; });
  svg.addEventListener('pointermove', e => { if (!ptr.has(e.pointerId)) return; ptr.set(e.pointerId, e);
    if (ptr.size === 2) { const [a, b] = [...ptr.values()], d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY); if (pin) zoom(pin / d); pin = d; return; }
    const r = svg.getBoundingClientRect(), s = Math.max(vb[2] / r.width, vb[3] / r.height);
    if (last) setVB([vb[0] - (e.clientX - last.clientX) * s, vb[1] - (e.clientY - last.clientY) * s, vb[2], vb[3]]); last = e; });
  const up = e => { ptr.delete(e.pointerId); if (ptr.size < 2) pin = null; if (!ptr.size) { last = null; svg.classList.remove('drag'); } };
  svg.addEventListener('pointerup', up); svg.addEventListener('pointercancel', up);

  /* ---------- pins ---------- */
  function drawPins() {
    const g = $('#anxPins'); g.innerHTML = '';
    VOLUNTEERS.forEach(v => { if (!N[v.post]) return; const [x, y] = N[v.post];
      const vg = el('g', { class: 'anx-pin', style: 'cursor:pointer' }, g);
      el('circle', { cx: x + 9, cy: y - 9, r: 5.5, fill: '#d9a454', stroke: '#fff', 'stroke-width': 1.2 }, vg);
      el('path', { d: `M${x + 9} ${y - 12.2}a1.6 1.6 0 1 0 .01 0M${x + 6.6} ${y - 5.6}a2.4 2.4 0 0 1 4.8 0`, fill: 'none', stroke: '#14100b', 'stroke-width': 1.3, 'stroke-linecap': 'round' }, vg);
      vg.addEventListener('click', openHelp); });
    for (const [id, p] of Object.entries(P)) {
      if (!p.node) continue;
      const [x, y] = N[p.node], isFrom = id === st.from, isTo = id === st.to;
      const pg = el('g', { class: 'anx-pin' + (isFrom || isTo ? '' : ' dim'), 'data-id': id, tabindex: 0, role: 'button', 'aria-label': p.name }, g);
      if (isTo) {
        el('circle', { cx: x, cy: y, r: 7, fill: '#dca85b', class: 'anx-pulse' }, pg);
        el('use', { href: '#anxDest', x: x - 9, y: y - 25, width: 18, height: 24 }, pg);
      } else if (isFrom) {
        el('circle', { cx: x, cy: y, r: 8, fill: '#d9a454', class: 'anx-pulse' }, pg);
        el('circle', { cx: x, cy: y, r: 5.5, fill: '#d9a454', stroke: '#fff', 'stroke-width': 2 }, pg);
      } else {
        el('rect', { x: x - 4, y: y - 4, width: 8, height: 8, rx: 2, transform: `rotate(45 ${x} ${y})`, fill: p.type === 'gate' ? '#d9a454' : '#6dafbb', stroke: '#fff', 'stroke-width': 1.2 }, pg);
      }
      const label = (KIOSK && isFrom ? 'You are here · ' : '') + p.name + (p.fl === '1F' ? ' · 1F' : '');
      const w = label.length * 4.6 + 12, side = isTo ? 'top' : (p.lab || 'right');
      const lx = side === 'right' ? x + 10 : side === 'left' ? x - 10 - w : x - w / 2;
      const ly = side === 'top' ? y - 34 : side === 'below' ? y + 9 : y - 7;
      el('rect', { class: 'chip', x: lx, y: ly, width: w, height: 14, rx: 7 }, pg);
      el('text', { x: lx + w / 2, y: ly + 9.8, 'text-anchor': 'middle' }, pg, label);
      pg.addEventListener('click', () => { if (id !== st.from) { st.to = id; st.ev = null; go(); } });
    }
  }

  /* ---------- route drawing ---------- */
  let walkRAF;
  function drawRoute() {
    const g = $('#anxRoute'); g.innerHTML = ''; cancelAnimationFrame(walkRAF); $('#anxMe').innerHTML = '';
    if (!st.route) return;
    const pts = st.route.pts, d = 'M' + pts.map(p => p.join(',')).join('L');
    el('path', { d, fill: 'none', stroke: '#dca85b', 'stroke-width': 10, opacity: .14, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, g);
    const base = el('path', { d, fill: 'none', stroke: 'rgba(220,168,91,.35)', 'stroke-width': 2, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, g);
    const L = base.getTotalLength(), dots = el('g', {}, g), chev = el('g', {}, g);
    // Dubai-Mall style: dots + direction chevrons
    const n = Math.floor(L / 8);
    for (let i = 0; i <= n; i++) {
      const p = base.getPointAtLength(i * 8), c = el('circle', { cx: p.x, cy: p.y, r: 2.4, fill: '#0c0a07', stroke: '#ede09c', 'stroke-width': 1.3 }, dots);
      if (!reduce) { c.style.opacity = 0; c.style.transition = 'opacity .25s'; setTimeout(() => c.style.opacity = 1, 20 + i * 14); }
    }
    for (let s = 26; s < L - 14; s += 52) {
      const p = base.getPointAtLength(s), q = base.getPointAtLength(s + 1), a = Math.atan2(q.y - p.y, q.x - p.x) * 180 / Math.PI;
      const cg = el('g', { transform: `translate(${p.x} ${p.y}) rotate(${a})`, class: 'anx-chev' }, chev);
      el('circle', { r: 5.6, fill: '#dca85b', stroke: '#fff', 'stroke-width': 1.2, filter: 'url(#anxGlow)' }, cg);
      el('path', { d: 'M-1.8 -2.6 L1.8 0 L-1.8 2.6', fill: 'none', stroke: '#0c0a07', 'stroke-width': 1.6, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, cg);
    }
    // active-step highlight + walker
    st.hl = el('path', { d: '', fill: 'none', stroke: '#ede09c', 'stroke-width': 3.6, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', filter: 'url(#anxGlow)' }, g);
    st.me = el('circle', { r: 4.8, fill: '#fff', stroke: '#dca85b', 'stroke-width': 2.2, filter: 'url(#anxGlow)', cx: -50, cy: -50 }, $('#anxMe'));
  }
  function showStep(i, moveCam = true) {
    const R = st.route; st.step = Math.max(0, Math.min(i, R.steps.length - 1)); const s = R.steps[st.step];
    cancelAnimationFrame(walkRAF);
    const pts = s.segs.length ? [N[s.segs[0].a], ...s.segs.map(x => N[x.b])] : [N[P[st.to].node]];
    st.hl.setAttribute('d', s.segs.length ? 'M' + pts.map(p => p.join(',')).join('L') : '');
    if (s.segs.length && !reduce) {
      const Lh = st.hl.getTotalLength(), dur = Math.max(1400, Lh * 22); let t0 = null;
      const tick = t => { t0 ??= t; const k = ((t - t0) % (dur + 700)) / dur, p = st.hl.getPointAtLength(Math.min(k, 1) * Lh);
        st.me.setAttribute('cx', p.x); st.me.setAttribute('cy', p.y); walkRAF = requestAnimationFrame(tick); };
      walkRAF = requestAnimationFrame(tick);
    } else { st.me.setAttribute('cx', pts[pts.length - 1][0]); st.me.setAttribute('cy', pts[pts.length - 1][1]); }
    renderCard();
    if (moveCam) fit(pts.length > 1 ? pts : [pts[0], pts[0]], 40, 230);
  }

  /* ---------- card ---------- */
  function renderCard() {
    const c = $('#anxCard'), T = P[st.to], ev = st.ev != null ? EVENTS[st.ev] : null;
    if (!T.node) {
      c.innerHTML = `<div class="anx-cardHead"><span class="t mono">${ev ? ev.name : 'Destination'}</span><span class="m">${ev ? fmt(ev.t[0]) + ' – ' + fmt(ev.t[1]) : ''}</span></div>
        <div class="anx-pending"><b>${T.name}</b> (${T.sub}) is not drawn on this map yet. Take the stairs or lift to the 3rd floor and follow the AstroNexus signs to the Common Room.</div>`;
      return;
    }
    const R = st.route, s = R.steps[st.step], n = R.steps.length;
    c.innerHTML = `<div class="anx-cardHead"><span class="t mono">${ev ? ev.name + ' · ' : ''}Step ${st.step + 1} of ${n}</span>
        <span class="m"><b>${R.min} min</b> · ${R.m} m${ev ? ' · ' + fmt(ev.t[0]) : ''}</span></div>
      <div class="anx-now"><div class="anx-arrow">${icon(s.icon)}</div><div class="anx-instr">${s.text}<small>${s.sub}</small></div></div>
      ${photoOf(s) ? `<button class="anx-photo" id="anxPh"><img src="${photoOf(s)}" alt="${PHOTO_CAP[s.node] || ''}"><span>📷 ${PHOTO_CAP[s.node] || 'What you will see'}</span></button>` : ''}
      <div class="anx-stepNav"><div class="anx-dots">${R.steps.map((_, i) => `<i class="${i === st.step ? 'on' : i < st.step ? 'done' : ''}"></i>`).join('')}</div>
        <button class="anx-btn" id="anxPrev" ${st.step === 0 ? 'disabled' : ''}>Back</button>
        <button class="anx-btn primary" id="anxNext">${st.step === n - 1 ? 'Overview' : 'Next'}</button></div>
      ${ev && ev.also ? `<div class="anx-stepNav anx-alsoRow" style="grid-template-columns:1fr auto"><span class="mono" style="font-size:10.5px;color:var(--muted)">Also part of ${ev.name}</span>
        <button class="anx-btn" id="anxAlso">→ ${P[st.to === ev.to ? ev.also : ev.to].name}</button></div>` : ''}
      <details class="anx-all"><summary>All directions</summary><ol class="anx-list">${R.steps.map((x, i) => `<li data-i="${i}" class="${i === st.step ? 'on' : ''}">${icon(x.icon)}<div>${x.text}</div><span>${x.m ? x.m + ' m' : ''}</span></li>`).join('')}</ol></details>`;
    $('#anxPrev').onclick = () => showStep(st.step - 1);
    $('#anxNext').onclick = () => { if (st.step === n - 1) { showStep(0, false); fit(R.pts); } else showStep(st.step + 1); };
    if ($('#anxAlso')) $('#anxAlso').onclick = () => { st.to = st.to === ev.to ? ev.also : ev.to; go(); };
    c.querySelectorAll('[data-i]').forEach(li => li.onclick = () => showStep(+li.dataset.i));
    if ($('#anxPh')) $('#anxPh').onclick = () => lightbox(photoOf(s), PHOTO_CAP[s.node]);
  }
  /* ---------- volunteers + photos ---------- */
  const photoOf = s => (s.segs[0] && PHOTOS[`${s.node}>${s.segs[0].b}`]) || PHOTOS[s.node];
  const assigned = v => v && v.name && !/to be assigned/i.test(v.name);
  const tel = p => (p || '').replace(/[^+\d]/g, '');
  // the volunteer to show for a step: one posted at this step's turn, else anywhere along it, else the destination
  const volFor = s => { const ns = [s.node, ...s.segs.map(x => x.b)]; return VOLUNTEERS.find(v => v.post === s.node) || VOLUNTEERS.find(v => ns.includes(v.post)); };
  const vAv = v => `<span class="av">${v.photo ? `<img src="${v.photo}" alt="">` : (assigned(v) ? v.name.split(/\s+/).map(w => w[0]).slice(0, 2).join('') : '🙋')}</span>`;
  function volChip(v) {
    const ph = v.phone || HELPLINE.phone;
    return `<div class="anx-vol">${vAv(v)}<div><b>${assigned(v) ? v.name : 'AstroNexus volunteer'}</b><small>Standing at: ${v.where}</small></div>
      ${ph ? `<a class="anx-call" href="tel:${tel(ph)}">Call</a>` : `<span class="anx-call off">Ask in person</span>`}</div>`;
  }
  function lightbox(src, cap) {
    const d = document.createElement('div'); d.className = 'anx-light'; d.innerHTML = `<div><img src="${src}" alt=""><p>${cap || ''}</p></div>`;
    d.onclick = () => d.remove(); $('#anxNav').appendChild(d);
  }
  function openHelp() {
    picking = 'help'; $('#anxSheet').hidden = false; $('#anxQ').hidden = true;
    $('#anxOpts').innerHTML = `<div class="anx-grp mono">Need help? Find a volunteer</div>
      ${HELPLINE.phone ? `<div class="anx-vcard"><span class="av">☎</span><div><b>${HELPLINE.name}</b><small>Any question, any time</small></div><a class="anx-call" href="tel:${tel(HELPLINE.phone)}">Call ${HELPLINE.phone}</a></div>` : ''}
      ${VOLUNTEERS.map(v => `<div class="anx-vcard" data-post="${v.post}">${vAv(v)}<div><b>${assigned(v) ? v.name : 'Volunteer (to be assigned)'}</b><small>${v.where}</small></div>
        ${(v.phone || HELPLINE.phone) ? `<a class="anx-call" href="tel:${tel(v.phone || HELPLINE.phone)}">Call</a>` : `<span class="anx-call off">Show</span>`}</div>`).join('')}
      <p class="anx-pending" style="padding:10px 4px 0">Volunteers wear AstroNexus T-shirts. Tap a volunteer to see where they are on the map.</p>`;
    $('#anxOpts').querySelectorAll('[data-post]').forEach(r => r.onclick = e => { if (e.target.closest('a')) return; closePicker(); const p = N[r.dataset.post]; fit([p, p], 40, 240); });
  }

  /* ---------- top bar + picker ---------- */
  function renderBar() {
    $('#anxFromT').textContent = (KIOSK ? 'You are here · ' : '') + P[st.from].name; $('#anxFromF').textContent = P[st.from].fl;
    $('#anxToT').textContent = (st.ev != null ? EVENTS[st.ev].name + ' · ' : '') + P[st.to].name; $('#anxToF').textContent = P[st.to].fl;
    $('#anxHud').innerHTML = `Campus · <b>GEMS NMS</b><br>N ↑ · 5 Nov 2026<br>${new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Dubai' })} GST`;
  }
  let picking = null;
  function openPicker(which) {
    picking = which; $('#anxSheet').hidden = false; $('#anxQ').value = ''; renderOpts(''); setTimeout(() => $('#anxQ').focus(), 50);
  }
  function renderOpts(q) {
    q = q.toLowerCase(); const m = s => !q || s.toLowerCase().includes(q); let h = '';
    if (picking === 'to') {
      const evs = EVENTS.map((e, i) => ({ e, i })).filter(({ e }) => m(e.name + P[e.to].name + e.who));
      if (evs.length) h += `<div class="anx-grp mono">Events</div>` + evs.map(({ e, i }) => `<button class="anx-opt" data-ev="${i}"><i style="background:${e.c}"></i>
        <span>${e.name}<small>${P[e.to].name}${e.also ? ' + ' + P[e.also].name : ''} · ${e.who}</small></span><em>${live(e) ? 'LIVE' : fmt(e.t[0])}</em></button>`).join('');
    }
    const pl = Object.entries(P).filter(([id, p]) => m(p.name + p.sub) && (picking === 'to' || p.node));
    if (pl.length) h += `<div class="anx-grp mono">Places</div>` + pl.map(([id, p]) => `<button class="anx-opt" data-pl="${id}"><i style="background:${p.type === 'gate' ? '#d9a454' : '#6dafbb'}"></i>
      <span>${p.name}<small>${p.sub}</small></span><em>${p.fl}</em></button>`).join('');
    $('#anxOpts').innerHTML = h || '<p class="anx-pending">No match.</p>';
    $('#anxOpts').querySelectorAll('[data-ev]').forEach(b => b.onclick = () => { st.ev = +b.dataset.ev; st.to = EVENTS[st.ev].to; closePicker(); go(); });
    $('#anxOpts').querySelectorAll('[data-pl]').forEach(b => b.onclick = () => { if (picking === 'to') { st.to = b.dataset.pl; st.ev = null; } else st.from = b.dataset.pl; closePicker(); go(); });
  }
  const closePicker = () => { $('#anxSheet').hidden = true; picking = null; $('#anxQ').hidden = false; };

  $('#anxFrom').onclick = () => { if (!KIOSK) openPicker('from'); }; $('#anxTo').onclick = () => openPicker('to');
  $('#anxQ').addEventListener('input', e => renderOpts(e.target.value));
  $('#anxSheet').addEventListener('click', e => { if (e.target.id === 'anxSheet') closePicker(); });
  addEventListener('keydown', e => { if (e.key === 'Escape') closePicker(); });
  $('#anxSwap').onclick = () => { if (KIOSK || !P[st.to].node) return; [st.from, st.to] = [st.to, st.from]; st.ev = null; go(); };

  /* ---------- main ---------- */
  function go() {
    if (KIOSK && st.to === KIOSK) {   // already here
      renderBar(); drawPins(); st.route = null; drawRoute(); fit([N[P[KIOSK].node], N[P[KIOSK].node]], 40, 260);
      $('#anxCard').innerHTML = `<div class="anx-cardHead"><span class="t mono">You are here</span></div><div class="anx-pending"><b>You are already at ${P[KIOSK].name}.</b> Pick another place or event at the top.</div>`; return; }
    if (st.from === st.to) st.from = st.to === 'exit3' ? 'zayed' : 'exit3';
    renderBar(); drawPins();
    const T = P[st.to];
    if (!T.node) { st.route = null; drawRoute(); renderCard(); fit([[0, 0], [670, 560]], 0); return; }
    const segs = shortest(P[st.from].node, T.node);
    const pts = [N[segs[0].a], ...segs.map(s => N[s.b])];
    const len = segs.reduce((a, s) => a + s.w, 0) * M_PER_UNIT, stairs = (segs.some(s => s.k === 'stairs') ? 1 : 0) + (segs.some(s => s.k === 'stairs3') ? 2 : 0);
    st.route = { segs, pts, steps: buildSteps(segs, st.from, st.to), m: Math.round(len / 10) * 10, min: Math.max(1, Math.round(len / WALK / 60 + stairs)) };
    drawRoute(); st.step = 0; showStep(0, false); fit(pts);
  }

  if (KIOSK) {
    let idle, warn, left = 0; const el = document.createElement('div'); el.className = 'anx-idle'; el.hidden = true; $('#anxNav').appendChild(el);
    const home = () => { closePicker(); st.to = 'zayed'; st.ev = null; $('#anxNav').hidden = true; $('#anxWelcome').hidden = false; stars.start(); el.hidden = true; };
    const poke = () => { clearTimeout(idle); clearInterval(warn); el.hidden = true;
      idle = setTimeout(() => { if ($('#anxNav').hidden) return; left = 10; el.hidden = false; el.textContent = `Returning to start in ${left}s · touch to stay`;
        warn = setInterval(() => { left--; el.textContent = `Returning to start in ${left}s · touch to stay`; if (left <= 0) { clearInterval(warn); home(); } }, 1000); }, 50000); };
    ['pointerdown', 'keydown', 'wheel'].forEach(t => addEventListener(t, poke, { passive: true })); poke();
    addEventListener('pointerdown', () => { if (!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(() => {}); }, { once: true });
    addEventListener('contextmenu', e => e.preventDefault());
  }
  // Offline: after one visit with internet, the map keeps working with no data (needs https hosting)
  if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});

  drawCampus(); welcome(); stars.start();
  setInterval(() => { welcome(); renderBar(); }, 60000);
  const lv = EVENTS.findIndex(live); if (lv >= 0) { st.ev = lv; st.to = EVENTS[lv].to; }
})();
</script>
</body>
